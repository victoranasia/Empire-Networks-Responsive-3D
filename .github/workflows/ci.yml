name: Empire Networks CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Empire-Networks-Responsive-3D/package-lock.json

      - name: Install dependencies
        working-directory: Empire-Networks-Responsive-3D
        run: npm ci

      - name: Build website
        working-directory: Empire-Networks-Responsive-3D
        run: npm run build
